name: SEA News Digest

on:
  workflow_dispatch:

  schedule:
    # UTC 00:00 = Beijing time 08:00
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, summarize and push Southeast Asia news
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_ITEMS: "30"
          MAX_PER_SOURCE: "1"
          LOOKBACK_HOURS: "24"
          DIGEST_ITEMS: "8"
        run: python scripts/fetch_sea_news.py