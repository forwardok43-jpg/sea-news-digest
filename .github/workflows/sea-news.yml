name: SEA News Digest

on:
  workflow_dispatch:

  schedule:
    # UTC 00:00 = Beijing time 08:00
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, summarize and push Southeast Asia news
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAX_ITEMS: "200"
          MAX_PER_SOURCE: "4"
          LOOKBACK_HOURS: "24"
          DIGEST_ITEMS: "80"
          ENABLE_AI_SUMMARY: "1"
          SUMMARY_BATCH_SIZE: "8"
          SUMMARY_WORKERS: "2"
          OVERVIEW_MIN_CHARS: "300"
          OVERVIEW_MAX_CHARS: "500"
          FETCH_WORKERS: "10"
          TRANSLATE_WORKERS: "2"
        run: python scripts/fetch_sea_news.py